name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm test:main
          pnpm test:renderer
          pnpm test:shared

  build-mac:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macOS build dependencies
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build renderer and main bundles
        run: |
          touch .env
          pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Electron e2e
        run: pnpm test:e2e

      - name: Stamp incrementing release version
        id: meta
        run: |
          VERSION="2.0.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Require Developer ID secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK is empty. Add the macOS signing secrets listed in docs/guides/macos-signing.md, then re-run this workflow."
            exit 1
          fi

      - name: Package macOS app
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Verify Developer ID signature
        run: |
          shopt -s nullglob
          apps=(dist/mac-arm64/*.app dist/mac-x64/*.app dist/mac/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "No .app bundles found under dist/"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-lite-mac
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cherry Lite ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})
          body: |
            Cherry Lite `${{ steps.meta.outputs.version }}` 由主干提交自动构建。

            - 提交：`${{ github.sha }}`
            - 说明：${{ github.event.head_commit.message || github.event_name }}

            macOS 安装包（Developer ID 签名并公证）：
            - Apple Silicon (`arm64`)
            - Intel (`x64`)
          files: |
            dist/*.dmg
            dist/latest-mac.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
