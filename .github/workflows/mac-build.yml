name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm test:main
          pnpm test:renderer
          pnpm test:shared

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macOS build dependencies
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build renderer and main bundles
        run: |
          touch .env
          pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Electron e2e
        run: pnpm test:e2e

      - name: Stamp incrementing release version
        id: meta
        run: |
          VERSION="2.0.${GITHUB_RUN_NUMBER}"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          {
            echo "version=${VERSION}"
            echo "short_sha=${SHORT_SHA}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Package macOS app
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never
        env:
          # Unsigned build: no Apple credentials are configured for this fork.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-lite-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Cherry Studio Lite ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.short_sha }})
          body: |
            Cherry Studio Lite `${{ steps.meta.outputs.version }}` 由主干提交自动构建。

            - 提交：`${{ github.sha }}`
            - 说明：${{ github.event.head_commit.message || github.event_name }}

            macOS 安装包（未签名）：
            - Apple Silicon (`arm64`)
            - Intel (`x64`)
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
