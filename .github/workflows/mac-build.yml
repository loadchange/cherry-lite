name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mac-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm test:main
          pnpm test:renderer
          pnpm test:shared

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - name: macOS build dependencies
        run: brew install python-setuptools

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build renderer and main bundles
        run: |
          touch .env
          pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Electron e2e
        run: pnpm test:e2e

      - name: Package macOS app
        run: pnpm exec electron-builder --mac --arm64 --x64
        env:
          # Unsigned build: no Apple credentials are configured for this fork.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-lite-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
